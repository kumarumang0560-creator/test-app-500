<!doctype html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mock Test App</title>
<style>
:root{--bg:#f4f6fb;--cd:#fff;--tx:#1b1f2a;--mu:#667085;--br:#d9deea;--pr:#2563eb;--g:#16a34a;--r:#dc2626;--p:#7c3aed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151c;--cd:#1c2029;--tx:#e8ebf2;--mu:#98a2b3;--br:#323846}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:1000px;margin:auto;padding:12px}
h1{font-size:22px;margin:6px 0 10px}.mut{color:var(--mu);font-size:13px}
.card{background:var(--cd);border:1px solid var(--br);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn,.btn2{border:1px solid var(--pr);background:var(--pr);color:#fff;padding:9px 14px;border-radius:9px;font-size:15px;cursor:pointer}
.btn2{background:transparent;color:var(--tx);border-color:var(--br)}
.btn.g{background:var(--g);border-color:var(--g)}.btn.p{background:var(--p);border-color:var(--p)}.btn.r{background:var(--r);border-color:var(--r)}
.tabs{display:flex;gap:6px;overflow-x:auto}.tab{border:1px solid var(--br);background:var(--cd);color:var(--tx);padding:6px 12px;border-radius:20px;white-space:nowrap}
.tab.on{background:var(--pr);color:#fff;border-color:var(--pr)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--br);border-radius:8px;background:var(--cd);color:var(--tx);font:inherit;margin:4px 0 10px}
textarea{min-height:200px;font:13px/1.4 ui-monospace,Menlo,monospace}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto;margin:0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5}
.ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tm{font-weight:700;font-size:18px;color:var(--r)}
.sm{justify-content:space-between}
.wrap{display:flex;gap:12px;align-items:flex-start}.main{flex:1;min-width:0}
#pal{width:230px;background:var(--cd);border:1px solid var(--br);border-radius:12px;padding:10px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pn{border:2px solid transparent;border-radius:8px;padding:7px 0;background:#e5e7eb;color:#222;font-weight:600}
.pn.g{background:var(--g);color:#fff}.pn.r{background:var(--r);color:#fff}.pn.p{background:var(--p);color:#fff}.pn.pa{background:var(--p);color:#fff;outline:2px solid var(--g)}.pn.c{border-color:var(--tx)}
.pb{display:none}
.qtxt{font-size:18px;margin-bottom:10px}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--br);background:transparent;color:var(--tx);border-radius:10px;padding:10px;margin:7px 0;font-size:16px;cursor:pointer}
.opt i{font-style:normal;font-weight:700;min-width:26px;height:26px;border-radius:50%;border:1px solid var(--br);display:grid;place-items:center;font-size:13px}
.opt.sel{border-color:var(--pr);background:rgba(37,99,235,.12)}.opt.sel i{background:var(--pr);color:#fff}
.opt.ok{border-color:var(--g);background:rgba(22,163,74,.14)}.opt.no{border-color:var(--r);background:rgba(220,38,38,.12)}
.foot .btn,.foot .btn2{flex:1;min-width:110px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:20}
.ov div{background:var(--cd);padding:24px;border-radius:14px;text-align:center}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.sum div{background:var(--cd);border:1px solid var(--br);border-radius:10px;padding:10px;text-align:center}.sum b{display:block;font-size:22px}
.ex{background:rgba(37,99,235,.09);border-radius:8px;padding:8px;margin-top:8px;font-size:15px}
sup,sub{font-size:.7em;line-height:0}
.rt{white-space:nowrap}.ov2{border-top:1.5px solid currentColor;padding:0 2px}
.fr{display:inline-block;text-align:center;vertical-align:middle;line-height:1.1;margin:0 2px}.fr i{display:block;font-style:normal;border-bottom:1.5px solid currentColor;padding:0 3px}.fr b{display:block;font-weight:400}
@media(max-width:760px){.wrap{display:block}#pal{display:none;position:fixed;right:8px;top:60px;z-index:10;box-shadow:0 8px 30px rgba(0,0,0,.4)}#pal.show{display:block}.pb{display:inline-block}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),MAX=500;
const mem={};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},
set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){mem[k]=v;return false}},
del(k){try{localStorage.removeItem(k)}catch(e){}delete mem[k]}};
let tests=LS.get('tb_tests',[]),filter='All',view='home',T,S,tk,lg='en';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function fmt(s){return esc(s||'')
.replace(/\{([^{}\/]+)\/([^{}]+)\}/g,'<span class=fr><i>$1</i><b>$2</b></span>')
.replace(/sqrt\(([^)]*)\)/g,'<span class=rt>√<span class=ov2>$1</span></span>')
.replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>').replace(/\^(-?\w+)/g,'<sup>$1</sup>')
.replace(/_\{([^}]*)\}/g,'<sub>$1</sub>').replace(/_(\d)/g,'<sub>$1</sub>')
.replace(/\bpi\b/g,'π').replace(/\btheta\b/g,'θ').replace(/\balpha\b/g,'α').replace(/\bbeta\b/g,'β')
.replace(/deg\b/g,'°').replace(/&lt;=/g,'≤').replace(/&gt;=/g,'≥').replace(/!=/g,'≠').replace(/\+-/g,'±')
.replace(/-&gt;/g,'→').replace(/\binfty\b/g,'∞').replace(/\btriangle\b/g,'△').replace(/\bangle\b/g,'∠').replace(/\*/g,'×')}
const bi=s=>{const p=String(s).split('||');return{en:p[0].trim(),hi:(p[1]||'').trim()}};
const L=o=>(lg=='hi'&&o.hi)?o.hi:o.en;
const mmss=s=>{s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const saveT=()=>LS.set('tb_tests',tests)||alert('Storage full ho gaya. Kuch test delete karo.');

function parse(txt){const qs=[];let c=null,f='q',bad=0;
const push=()=>{if(!c)return;if(c.o.length>=2&&c.a>=0&&c.a<c.o.length&&c.q)qs.push({q:bi(c.q),o:c.o.map(bi),a:c.a,e:bi(c.e)});else bad++;c=null};
for(let ln of txt.replace(/\r/g,'').split('\n')){const t=ln.trim();if(!t)continue;let m;
if(m=t.match(/^Q\s*\d*\s*[.:)]\s*(.*)/i)||(m=t.match(/^\d+\s*[.)]\s+(.*)/))){push();c={q:m[1],o:[],a:-1,e:''};f='q'}
else if(!c)continue;
else if(m=t.match(/^\(?([A-D])[).]\s*(.*)/i)){c.o.push(m[2]);f='o'}
else if(m=t.match(/^Ans(?:wer)?\s*[:\-]\s*\(?([A-D1-4])/i)){const k=m[1].toUpperCase();c.a='ABCD'.includes(k)?'ABCD'.indexOf(k):+k-1;f='a'}
else if(m=t.match(/^Exp(?:lanation)?\s*[:\-]\s*(.*)/i)){c.e=m[1];f='e'}
else if(f=='q')c.q+=' '+t;else if(f=='o')c.o[c.o.length-1]+=' '+t;else if(f=='e')c.e+=' '+t}
push();return{qs,bad}}

const SAMPLE={
'GK/GS':`Q1. What is the capital of India? || भारत की राजधानी क्या है?
A) Mumbai || मुंबई
B) New Delhi || नई दिल्ली
C) Kolkata || कोलकाता
D) Chennai || चेन्नई
Ans: B
Exp: New Delhi is the capital. || नई दिल्ली भारत की राजधानी है।

Q2. Who wrote the Indian Constitution's draft? || संविधान की प्रारूप समिति के अध्यक्ष कौन थे?
A) Nehru || नेहरू
B) Gandhi || गांधी
C) B. R. Ambedkar || डॉ. बी. आर. अंबेडकर
D) Patel || पटेल
Ans: C
Exp: Dr. Ambedkar chaired the Drafting Committee. || डॉ. अंबेडकर प्रारूप समिति के अध्यक्ष थे।`,
'Math':`Q1. If x^2 = 49, then x = ? || यदि x^2 = 49 है, तो x = ?
A) 7
B) -7
C) +-7
D) 49
Ans: C
Exp: x = +-sqrt(49) = +-7 || x = +-sqrt(49) = +-7

Q2. sqrt(144) + {3/4} of 80 = ? || sqrt(144) + 80 का {3/4} = ?
A) 62
B) 72
C) 82
D) 92
Ans: B
Exp: 12 + 60 = 72

Q3. sin 30deg = ? || sin 30deg = ?
A) {1/2}
B) {sqrt(3)/2}
C) 1
D) 0
Ans: A
Exp: sin 30deg = {1/2}`,
'Reasoning':`Q1. Find the next: 2, 6, 12, 20, ? || अगली संख्या: 2, 6, 12, 20, ?
A) 28
B) 30
C) 32
D) 36
Ans: B
Exp: Differences 4, 6, 8, 10 → 20+10 = 30 || अंतर 4, 6, 8, 10 → 20+10 = 30`};

function home(){clearInterval(tk);view='home';
const list=tests.filter(t=>filter=='All'||t.sub==filter);
$('#app').innerHTML=`<h1>📝 Mock Test</h1>
<div class=bar><span>Storage: <b>${tests.length}/${MAX}</b> test</span><button class=btn onclick="create()">+ Naya Test</button></div>
<div class=tabs>${['All','GK/GS','Math','Reasoning'].map(x=>`<button class="tab ${x==filter?'on':''}" onclick="filter='${x}';home()">${x}</button>`).join('')}</div>
${list.length?'':'<p class=mut>Abhi koi test nahi. “+ Naya Test” dabao.</p>'}
${list.map(t=>{const r=LS.get('tb_r_'+t.id,null),p=LS.get('tb_s_'+t.id,null);return `<div class=card><label class=chk><input type=checkbox class=sel value="${t.id}"><b>${esc(t.title)}</b></label>
<div class=mut>${t.sub} • ${t.qs.length} MCQ • ${t.mins} min${r?` • Last: ${r.score}`:''}</div>
<div class=row>${p?`<button class=btn onclick="start('${t.id}')">▶ Resume</button><button class=btn2 onclick="start('${t.id}',1)">Restart</button>`:`<button class=btn onclick="start('${t.id}',1)">Start</button>`}
${r?`<button class=btn2 onclick="showRes('${t.id}')">Result</button>`:''}<button class=btn2 onclick="exp('${t.id}')">Export</button><button class=btn2 onclick="del(['${t.id}'])">🗑 Delete</button></div></div>`}).join('')}
${tests.length?`<div class=row><button class=btn2 onclick="delSel()">Selected delete</button><button class=btn2 onclick="document.querySelectorAll('.sel').forEach(x=>x.checked=true)">Sab select</button></div>`:''}
<div class=card><b>Student ko test dene ke liye</b><div class=mut>Is app ka link bhejo + test ki Export file. Student “Naya Test” → file import kare.</div><div class=row><button class=btn2 onclick="navigator.clipboard&&navigator.clipboard.writeText(location.href.split('#')[0]);alert('App link copy ho gaya')">🔗 App link copy</button></div></div>`}

function create(){view='create';
$('#app').innerHTML=`<h1>Naya Test</h1><div class=card>
<label>Test ka naam</label><input id=nm placeholder="GK Test 1">
<label>Section</label><select id=sb><option>GK/GS</option><option>Math</option><option>Reasoning</option></select>
<label>Time (minute)</label><input id=mn type=number value=43 min=1>
<label>MCQ paste karo (100 tak) ya .txt/.json file chuno</label>
<input type=file id=fl accept=".txt,.json" onchange="readF(this)">
<textarea id=tx placeholder="Q1. Question&#10;A) ...&#10;B) ...&#10;C) ...&#10;D) ...&#10;Ans: B&#10;Exp: ..."></textarea>
<div class=mut>English || हिन्दी likhne se bilingual ban jata hai. Math: x^2, sqrt(25), {3/4}, 30deg, pi, +-, &lt;=</div>
<div class=row><button class="btn g" onclick="addT()">✔ Test banao</button><button class=btn2 onclick="home()">Wapas</button></div>
<div class=row><span class=mut>Example:</span>${Object.keys(SAMPLE).map(k=>`<button class=btn2 onclick="$('#tx').value=SAMPLE['${k}'];$('#sb').value='${k}'">${k}</button>`).join('')}<button class=btn2 onclick="dlS()">⬇ Example .txt</button></div></div>`}
function readF(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{if(/\.json$/i.test(f.name)){imp(r.result)}else{$('#tx').value=r.result;if(!$('#nm').value)$('#nm').value=f.name.replace(/\.\w+$/,'')}};r.readAsText(f)}
function imp(s){try{const d=JSON.parse(s);let n=0;(d.tests||[]).forEach(t=>{if(tests.length<MAX&&t.qs){t.id=uid();tests.push(t);n++}});saveT();alert(n+' test import hue');home()}catch(e){alert('File sahi nahi hai')}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function addT(){if(tests.length>=MAX)return alert('500 test full ho gaye. Kaam ke nahi test delete karo.');
const {qs,bad}=parse($('#tx').value);if(!qs.length)return alert('Koi sahi MCQ nahi mila. Format check karo (Ans: zaroori hai).');
if(bad&&!confirm(bad+' MCQ format galat the, chhod diye. Baaki '+qs.length+' se test banau?'))return;
tests.push({id:uid(),title:$('#nm').value.trim()||'Test '+(tests.length+1),sub:$('#sb').value,mins:+$('#mn').value||43,qs});saveT();home()}
function dlS(){const b=new Blob([Object.entries(SAMPLE).map(([k,v])=>'# '+k+'\n'+v).join('\n\n')],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mcq-example.txt';a.click()}
function exp(id){const t=tests.find(x=>x.id==id);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({tests:[t]})],{type:'application/json'}));a.download=t.title.replace(/\W+/g,'_')+'.json';a.click()}
function del(ids){if(!ids.length||!confirm(ids.length+' test delete karein?'))return;tests=tests.filter(t=>!ids.includes(t.id));ids.forEach(i=>{LS.del('tb_s_'+i);LS.del('tb_r_'+i)});saveT();home()}
function delSel(){del([...document.querySelectorAll('.sel:checked')].map(x=>x.value))}

const sv=()=>{LS.set('tb_s_'+T.id,S)};
function start(id,fresh){T=tests.find(t=>t.id==id);const old=LS.get('tb_s_'+id,null);
if(!fresh&&old){S=old;S.paused=true}else{S={ans:{},mark:{},vis:{0:1},time:T.qs.map(()=>0),cur:0,rem:T.mins*60,lang:'en',paused:false};sv()}
lg=S.lang;view='test';clearInterval(tk);tk=setInterval(tick,1000);draw()}
function tick(){if(view!='test'||S.paused)return;S.rem--;S.time[S.cur]++;sv();if(S.rem<=0){finish(true);return}upd()}
function upd(){const a=$('#tm'),b=$('#qt');if(a)a.textContent='⏳ '+mmss(S.rem);if(b)b.textContent=mmss(S.time[S.cur])}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&view=='test'&&!S.paused){S.paused=true;sv();draw()}});
addEventListener('pagehide',()=>{if(view=='test'){S.paused=true;sv()}});
function draw(){const q=T.qs[S.cur],n=T.qs.length;
const st=i=>S.ans[i]!==undefined?(S.mark[i]?'pa':'g'):S.mark[i]?'p':S.vis[i]?'r':'';
const cnt=k=>T.qs.filter((_,i)=>st(i)==k).length;
$('#app').innerHTML=`<div class=top><b class=ttl>${esc(T.title)}</b><span class=tm id=tm></span></div>
<div class="row sm"><span>Q ${S.cur+1}/${n}</span><span class=mut>⏱ <span id=qt></span></span><span class=row><button class=btn2 onclick="tgl()">${lg=='hi'?'EN':'हिं'}</button><button class=btn2 onclick="S.paused=true;sv();draw()">⏸ Pause</button><button class="btn2 pb" onclick="$('#pal').classList.toggle('show')">☰</button></span></div>
<div class=wrap><div class=main><div class=card><div class=qtxt>${S.cur+1}. ${fmt(L(q.q))}</div>
${q.o.map((o,j)=>`<button class="opt ${S.ans[S.cur]===j?'sel':''}" onclick="pick(${j})"><i>${'ABCD'[j]}</i><span>${fmt(L(o))}</span></button>`).join('')}</div>
<div class="row foot"><button class=btn2 onclick="go(S.cur-1)">← Previous</button><button class="btn p" onclick="S.mark[S.cur]=1;go(S.cur+1)">Mark for Review & Next</button><button class=btn2 onclick="delete S.ans[S.cur];draw()">Clear</button><button class="btn g" onclick="go(S.cur+1)">Save & Next</button><button class="btn r" onclick="sub()">Submit Test</button></div></div>
<aside id=pal><div class=mut>🟩 ${cnt('g')+cnt('pa')} Answered • 🟥 ${cnt('r')} Not answered • 🟪 ${cnt('p')+cnt('pa')} Review</div><div class=grid style="margin-top:8px">${T.qs.map((_,i)=>`<button class="pn ${st(i)} ${i==S.cur?'c':''}" onclick="go(${i})">${i+1}</button>`).join('')}</div></aside></div>
${S.paused?`<div class=ov><div><h2>⏸ Test Paused</h2><p class=mut>Time ruka hua hai: ${mmss(S.rem)} bacha</p><button class="btn g" onclick="S.paused=false;draw()">▶ Resume</button> <button class=btn2 onclick="home()">Home</button></div></div>`:''}`;upd()}
function go(i){if(i<0||i>=T.qs.length){if(i>=T.qs.length)return sub();return}S.cur=i;S.vis[i]=1;sv();draw()}
function pick(j){S.ans[S.cur]=j;sv();draw()}
function tgl(){lg=lg=='hi'?'en':'hi';S.lang=lg;draw()}
function sub(){const a=Object.keys(S.ans).length;if(confirm(`Answered: ${a}\nNot answered: ${T.qs.length-a}\nTest submit karein?`))finish()}
function finish(auto){clearInterval(tk);let c=0,w=0;T.qs.forEach((q,i)=>{if(S.ans[i]===undefined)return;S.ans[i]===q.a?c++:w++});
const r={c,w,u:T.qs.length-c-w,score:(c-w*.25).toFixed(2).replace(/\.?0+$/,''),ans:S.ans,time:S.time,used:T.mins*60-S.rem,lang:lg};
LS.set('tb_r_'+T.id,r);LS.del('tb_s_'+T.id);view='res';if(auto)alert('Time khatam! Test submit ho gaya.');showRes(T.id)}
function showRes(id){T=tests.find(t=>t.id==id);const r=LS.get('tb_r_'+id,null);if(!r)return;view='res';
$('#app').innerHTML=`<h1>Result: ${esc(T.title)}</h1>
<div class=sum><div><b style="color:var(--g)">${r.c}</b>Sahi (+1)</div><div><b style="color:var(--r)">${r.w}</b>Galat (−0.25)</div><div><b>${r.u}</b>Unattempted</div><div><b>${r.score}/${T.qs.length}</b>Score</div><div><b>${mmss(r.used)}</b>Time laga</div></div>
<div class=row><button class="btn g" onclick="start('${id}',1)">🔄 Retake</button><button class=btn2 onclick="lg=lg=='hi'?'en':'hi';showRes('${id}')">${lg=='hi'?'EN':'हिं'}</button><button class=btn2 onclick="home()">Home</button><button class=btn2 onclick="del(['${id}'])">🗑 Test delete</button></div>
${T.qs.map((q,i)=>{const a=r.ans[i];return `<div class=card><div class=mut>Q${i+1} • ${a===undefined?'Skipped':a===q.a?'✅ Sahi':'❌ Galat'} • ⏱ ${mmss(r.time[i]||0)}</div><div class=qtxt>${fmt(L(q.q))}</div>
${q.o.map((o,j)=>`<div class="opt ${j==q.a?'ok':j===a?'no':''}"><i>${'ABCD'[j]}</i><span>${fmt(L(o))}</span></div>`).join('')}
<div class=ex><b>Explanation:</b> ${fmt(L(q.e))||'—'}</div></div>`}).join('')}`;scrollTo(0,0)}
home();
</script></body></html>
